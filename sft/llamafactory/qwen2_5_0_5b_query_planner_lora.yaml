### model
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

### dataset
dataset_dir: ./data
dataset: rag_query_planner_train
eval_dataset: rag_query_planner_valid
template: qwen
cutoff_len: 1024
max_samples: 100000
preprocessing_num_workers: 8
overwrite_cache: true

### output
output_dir: ./saves/qwen2.5-0.5b-query-planner/lora/sft
overwrite_output_dir: true
logging_steps: 10
save_steps: 100
eval_steps: 50
plot_loss: true
report_to: none

### train
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
do_eval: true
eval_strategy: steps
val_size: 0.0
